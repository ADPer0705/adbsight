[package]
name = "adbsight"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "Cross-platform Rust TUI deep inspector for Android devices over USB and Wi-Fi ADB"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ADPer0705/adbsight"
documentation = "https://adbsight.dearanayji.rocks"
keywords = ["adb", "android", "tui", "ratatui", "wireless"]
categories = ["command-line-utilities", "development-tools::debugging"]
exclude = ["docs/*", "exports/*"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
csv = "1"
directories = "6"
qrcode = { version = "0.15", default-features = false }
rand = "0.10"
ratatui = "0.30"
regex = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
